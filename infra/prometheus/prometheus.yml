global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: securebank
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - identity-service:8081
          - banking-core-service:8082
          - fraud-service:8083
          - audit-service:8084
          - notification-service:8085
