server:
  port: ${PORT:8083}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: fraud-service
  config:
    # Local runs (mvn spring-boot:run) pick up the repo-root .env; Docker passes real env vars.
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/fraud}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: fraud-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

securebank:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: securebank-identity
    revocation-check: true
  outbox:
    enabled: true
  # Fraud rule thresholds (api.md §4). Rule weights are fixed by the contract.
  fraud:
    high-amount-threshold: 100000000
    high-frequency-max-transfers: 5
    high-frequency-window: 60s
    daily-velocity-threshold: 200000000
    new-beneficiary-min-amount: 10000000
    alert-min-score: 30
    business-zone: Asia/Ho_Chi_Minh
  kafka:
    consumer:
      max-attempts: 4
      initial-backoff: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
