server:
  port: ${PORT:8082}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: banking-core-service
  autoconfigure:
    # stateless JWT only: no in-memory user / generated password
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    # Local runs (mvn spring-boot:run) pick up the repo-root .env; Docker passes real env vars.
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/banking}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    generator:
      write-bigdecimal-as-plain: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration,classpath:db/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: banking-core-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

securebank:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: securebank-identity
    revocation-check: true
  outbox:
    enabled: true
  banking:
    business-zone: Asia/Ho_Chi_Minh
    default-per-transaction-limit: 100000000.00
    default-daily-limit: 500000000.00
    # max wait for an account row lock / a duplicate Idempotency-Key inside a transfer
    lock-timeout: 5s
    idempotency-retention: 24h
    idempotency-cleanup-interval: 1h
  demo:
    # Seeds the two demo customers/accounts of docs/contracts/api.md §7. Local demo only.
    seed: ${SECUREBANK_DEMO_SEED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
